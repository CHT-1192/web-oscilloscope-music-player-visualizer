/* ============================================================================
   Web Oscilloscope Music Player — styles
   Dark instrument panel. Deliberately NO glow effects: no coloured box-shadow
   bloom, no text-shadow halo, no blur filters. Elevation is done with borders
   and neutral dark shadows only.
   ========================================================================== */

:root {
  --accent: #3dff9c;
  /* Translucent accents are DERIVED from --accent, never written as a literal
     rgba() of the default green: the theme colour is swapped at runtime, so a
     hard-coded wash leaves the old hue behind while the outline follows. */
  --accent-wash: color-mix(in srgb, var(--accent) 7%, transparent);
  --accent-rule: color-mix(in srgb, var(--accent) 40%, transparent);
  --bg: #03060a;
  --panel: rgba(9, 15, 20, 0.86);
  --panel-solid: #0a1016;
  --edge: rgba(150, 210, 195, 0.14);
  --edge-strong: rgba(150, 210, 195, 0.26);
  --text: #dce9e6;
  --muted: #7a8f8c;
  --muted-dim: #566663;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.62);
  --r: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

body.dragging::after {
  content: "释放以载入音频";
  position: fixed;
  inset: 14px;
  z-index: 90;
  display: grid;
  place-items: center;
  border: 2px dashed var(--accent);
  border-radius: 18px;
  background: rgba(3, 6, 10, 0.72);
  color: var(--accent);
  font-size: 17px;
  letter-spacing: 0.14em;
  pointer-events: none;
}

/* The whole layout is a grid that RESERVES space: the scope column is what is
   left after the topbar, the dock and any open panel. Nothing is ever drawn
   underneath the UI, so panels can never cover the trace. */
#app {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 0;
}
/* The chrome owns the top and bottom rows across the FULL width, so the stage
   (and therefore the canvas) never changes size or position when a panel opens.
   Panels are overlays that live in the dead margin beside the square plot; the
   plot is what makes room for them, and only when it actually has to. */
#app { grid-template-columns: minmax(0, 1fr); grid-auto-columns: 0; }
.topbar { grid-column: 1; grid-row: 1; }
.stage { grid-column: 1; grid-row: 2; }
.dock { grid-column: 1; grid-row: 3; }
.toast { grid-column: 1; }

/* ── stage / canvases ─────────────────────────────────────────────────── */

.stage { position: relative; min-width: 0; min-height: 0; }
.stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#bg { z-index: 0; }
#trace { z-index: 2; }

/* ── empty state ──────────────────────────────────────────────────────── */

.hint {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 24px;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.hint.hidden { opacity: 0; visibility: hidden; }
.hint-card {
  pointer-events: auto;
  text-align: center;
  max-width: 460px;
}
.hint-mark { font-size: 34px; color: var(--accent); opacity: 0.75; }
.hint-card h1 {
  margin: 14px 0 10px;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 0.3em;
  color: #93a7a3;
}
.hint-card h1 span { color: var(--accent); margin-left: 0.3em; }
.hint-main { margin: 0 0 6px; color: #a9bcb8; font-size: 14px; }
.hint-sub { margin: 0; color: var(--muted-dim); font-size: 12px; letter-spacing: 0.08em; }
.hint-tiny { margin: 14px 0 0; color: #4c5a58; font-size: 11.5px; line-height: 1.7; }

.link {
  background: none;
  border: 0;
  padding: 0 2px;
  font: inherit;
  color: var(--accent);
  border-bottom: 1px solid var(--accent-rule);
  cursor: pointer;
}
.link:hover { border-bottom-color: var(--accent); }

/* ── top bar ──────────────────────────────────────────────────────────── */

.topbar {
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 16px 10px;
  transition: opacity 0.4s ease;
}
.topbar > * { pointer-events: auto; }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.26em;
  color: #8fa3a0;
  text-transform: uppercase;
  user-select: none;
}
.brand i {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex: none;
}
.brand em { font-style: normal; color: var(--accent); }
.brand em::before { content: "·"; color: var(--muted-dim); margin-right: 0.3em; }

.tools { display: flex; gap: 8px; flex-wrap: wrap; }

.tbtn {
  appearance: none;
  background: rgba(9, 15, 20, 0.7);
  border: 1px solid var(--edge);
  color: #b9cbc7;
  font: inherit;
  font-size: 12px;
  padding: 7px 13px;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.18s, color 0.18s, background 0.18s;
  white-space: nowrap;
}
.tbtn:hover { border-color: var(--edge-strong); color: #eaf5f2; background: rgba(14, 22, 28, 0.86); }
.tbtn.on { border-color: var(--accent); color: var(--accent); }

/* ── dock ─────────────────────────────────────────────────────────────── */

.dock {
  z-index: 25;
  margin: 0 16px 16px;
  padding: 13px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 18px;
  border: 1px solid var(--edge);
  border-radius: 16px;
  background: var(--panel);
  /* NOTE: backdrop-filter here frosts the *control panel* surface only. It is
     never applied to the canvases, so it cannot bleed light around the beam.
     The "no glow" rule is about the trace, not about panel translucency. */
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  transition: opacity 0.4s ease;
}

.now { flex: 1 1 170px; min-width: 0; }
.now-title {
  font-size: 13.5px;
  font-weight: 500;
  color: #e6f1ee;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.now-sub {
  margin-top: 3px;
  font-size: 11px;
  color: var(--muted-dim);
  font-family: var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.seekwrap {
  flex: 3 1 300px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 220px;
}
.time {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
  min-width: 42px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.transport { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; }

.btn {
  appearance: none;
  width: 34px; height: 34px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  border: 1px solid var(--edge);
  background: rgba(255, 255, 255, 0.03);
  color: #c3d4d0;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  transition: border-color 0.16s, color 0.16s, background 0.16s;
}
.btn:hover { border-color: var(--edge-strong); color: #fff; background: rgba(255, 255, 255, 0.07); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 17px; height: 17px; fill: currentColor; display: block; }
.btn.play { width: 40px; height: 40px; border-color: var(--edge-strong); }
.btn.play.playing { border-color: var(--accent); color: var(--accent); }
.btn.play .i-pause { display: none; }
.btn.play.playing .i-play { display: none; }
.btn.play.playing .i-pause { display: block; }
.btn.on { border-color: var(--accent); color: var(--accent); }

.vol { display: flex; align-items: center; gap: 7px; padding-left: 4px; }
.vol svg { width: 16px; height: 16px; fill: var(--muted); flex: none; }
.vol input { width: 74px; }

#rate {
  appearance: none;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--edge);
  border-radius: 9px;
  color: #c3d4d0;
  font: inherit;
  font-size: 12px;
  height: 34px;
  padding: 0 6px;
  cursor: pointer;
}
#rate:hover { border-color: var(--edge-strong); }

/* ── range inputs ─────────────────────────────────────────────────────── */

input[type="range"] {
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  height: 18px;
  width: 100%;
  margin: 0;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 2px;
  background: rgba(160, 200, 190, 0.2);
}
input[type="range"]::-moz-range-track {
  height: 3px;
  border-radius: 2px;
  background: rgba(160, 200, 190, 0.2);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  margin-top: -4.5px;
  border-radius: 50%;
  background: var(--accent);
  border: 0;
}
input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
}

/* played-portion fill on the seek bar (--p is set from JS as a percentage) */
#seek::-webkit-slider-runnable-track {
  background: linear-gradient(to right,
    var(--accent) 0%,
    var(--accent) calc(var(--p, 0) * 1%),
    rgba(160, 200, 190, 0.2) calc(var(--p, 0) * 1%),
    rgba(160, 200, 190, 0.2) 100%);
}
#seek::-moz-range-progress { background: var(--accent); height: 3px; border-radius: 2px; }

/* ── panels ───────────────────────────────────────────────────────────── */

.panel {
  position: absolute;
  top: 62px;
  bottom: 106px;
  z-index: 30;
  width: 330px;
  max-width: 40vw;
  display: none;
  flex-direction: column;
  min-height: 0;
  border: 1px solid var(--edge);
  border-radius: var(--r);
  background: var(--panel);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
}
.panel.open { display: flex; animation: panelIn 0.18s ease-out; }
#panelList { left: 16px; }
#panelSettings { right: 16px; }
@keyframes panelIn { from { opacity: 0; } to { opacity: 1; } }

.panel-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 14px 11px;
  border-bottom: 1px solid var(--edge);
}
.panel-head h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #9db0ac;
}
.panel-head h2 span { color: var(--muted-dim); letter-spacing: 0.1em; }
.x {
  appearance: none;
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  padding: 2px 4px;
  line-height: 1;
}
.x:hover { color: #fff; }

.panel-body { overflow-y: auto; padding: 4px 14px 18px; }
.panel-foot { flex: none; padding: 11px 14px; border-top: 1px solid var(--edge); }

.group { padding: 14px 0 4px; border-bottom: 1px solid rgba(150, 210, 195, 0.08); }
.group:last-child { border-bottom: 0; }
.group h3 {
  margin: 0 0 10px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted-dim);
}
.group h3 span { color: #3f4c4a; margin-left: 6px; letter-spacing: 0.1em; }

.row {
  display: grid;
  grid-template-columns: 62px 1fr 50px;
  align-items: center;
  gap: 9px;
  padding: 3px 0;
  cursor: pointer;
}
.row > span { font-size: 12px; color: #a6b8b4; }
.row output {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.row input[type="color"] {
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--edge);
  border-radius: 7px;
  background: transparent;
  width: 100%;
  height: 24px;
  padding: 2px;
  cursor: pointer;
}
.row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.row input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 4px; }

.select-row { grid-template-columns: 62px 1fr auto; }
.select-row select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--edge);
  border-radius: 7px;
  color: #c3d4d0;
  font: inherit;
  font-size: 12px;
  padding: 5px 8px;
  cursor: pointer;
}
.select-row select:hover { border-color: var(--edge-strong); }

/* ── sample-rate badge: is the engine native to the file? ─────────────── */

.rate-badge {
  margin-right: auto;
  margin-left: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--edge);
  background: rgba(9, 15, 20, 0.7);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  white-space: nowrap;
  user-select: none;
  pointer-events: auto;
  cursor: default;
}
.rate-badge.is-native { border-color: var(--accent); color: var(--accent); }
.rate-badge.is-resampled { border-color: rgba(255, 196, 92, 0.5); color: #ffc45c; }
.perf-badge { pointer-events: none; }
.perf-badge.is-warn { border-color: rgba(255, 196, 92, 0.5); color: #ffc45c; }
.perf-badge[hidden] { display: none; }

/* a control that has no effect right now (e.g. the blanking threshold while
   velocity blanking is switched off) */
.row.is-off { opacity: 0.4; }

.swatches { display: flex; gap: 7px; padding: 9px 0 4px; flex-wrap: wrap; }
.swatch {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: var(--c);
  cursor: pointer;
  padding: 0;
}
.swatch.active { outline: 2px solid rgba(255, 255, 255, 0.55); outline-offset: 2px; }

.pills { display: flex; flex-wrap: wrap; gap: 7px; padding: 2px 0 6px; }
.pill {
  appearance: none;
  font: inherit;
  font-size: 12px;
  padding: 6px 11px;
  border-radius: 999px;
  border: 1px solid var(--edge);
  background: rgba(255, 255, 255, 0.025);
  color: #8fa2a0;
  cursor: pointer;
  transition: all 0.16s;
}
.pill:hover { border-color: var(--edge-strong); color: #d6e5e1; }
.pill[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-wash);
}

.ghost {
  appearance: none;
  width: 100%;
  font: inherit;
  font-size: 12px;
  padding: 8px;
  border-radius: 9px;
  border: 1px solid var(--edge);
  background: transparent;
  color: #94a7a4;
  cursor: pointer;
  transition: all 0.16s;
}
.ghost:hover { border-color: var(--edge-strong); color: #e2eeeb; }

/* ── presets ──────────────────────────────────────────────────────────── */

/* two modes, not two options of one thing, so they get a segmented control
   rather than a pair of independent toggles */
.seg { display: flex; gap: 0; padding: 2px 0 8px; }
.seg button {
  appearance: none;
  flex: 1 1 0;
  font: inherit;
  font-size: 11.5px;
  padding: 6px 8px;
  border: 1px solid var(--edge);
  background: transparent;
  color: #8fa2a0;
  cursor: pointer;
  transition: all 0.16s;
}
.seg button:first-child { border-radius: 8px 0 0 8px; }
.seg button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
.seg button:hover { color: #d6e5e1; }
.seg button[aria-checked="true"] {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-wash);
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 6px; }
.chip {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font: inherit;
  font-size: 11.5px;
  padding: 5px 10px;
  border-radius: 8px;
  border: 1px solid var(--edge);
  background: rgba(255, 255, 255, 0.025);
  color: #93a6a3;
  cursor: pointer;
  max-width: 100%;
  transition: all 0.16s;
}
.chip:hover { border-color: var(--edge-strong); color: #d6e5e1; }
.chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
.chip .x { font-size: 13px; line-height: 1; opacity: 0.5; padding: 0 1px; }
.chip .x:hover { opacity: 1; }
/* deleting a preset is not undoable, so the first click only arms it */
.chip.armed { border-color: rgba(255, 107, 138, 0.6); color: #ff6b8a; background: rgba(255, 107, 138, 0.08); }
.preset-status {
  margin: 2px 0 8px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--muted-dim);
  min-height: 1.6em;
}
.preset-status b { color: var(--accent); font-weight: 500; }
.preset-io { display: flex; gap: 6px; }
.preset-io .ghost { width: auto; flex: 1 1 0; font-size: 11.5px; padding: 6px 8px; }
.preset-row { display: flex; gap: 6px; padding-top: 6px; }
.preset-row[hidden] { display: none; }
.preset-row input {
  flex: 1 1 auto;
  min-width: 0;
  font: inherit;
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 8px;
  border: 1px solid var(--edge);
  background: rgba(0, 0, 0, 0.3);
  color: var(--text);
}
.preset-row input:focus { outline: none; border-color: var(--accent); }
.preset-row .ghost { width: auto; font-size: 11.5px; padding: 6px 10px; }
.preset-text {
  width: 100%;
  height: 92px;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.5;
  padding: 7px 8px;
  border-radius: 8px;
  border: 1px solid var(--edge);
  background: rgba(0, 0, 0, 0.34);
  color: var(--text);
  resize: vertical;
}
.preset-text[hidden] { display: none; }
.preset-text:focus { outline: none; border-color: var(--accent); }

/* ── playlist ─────────────────────────────────────────────────────────── */

.tracks {
  list-style: none;
  margin: 0;
  padding: 7px;
  overflow-y: auto;
  flex: 1 1 auto;
}
.track {
  display: grid;
  grid-template-columns: 24px 1fr;
  grid-template-areas: "n name" "n meta";
  gap: 1px 8px;
  padding: 9px 10px;
  border-radius: 9px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.14s, border-color 0.14s;
}
.track:hover { background: rgba(255, 255, 255, 0.045); }
.track.active { border-color: var(--accent); background: var(--accent-wash); }
.track .n {
  grid-area: n;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted-dim);
  padding-top: 2px;
}
.track.active .n { color: var(--accent); }
.track .name {
  grid-area: name;
  font-size: 12.5px;
  color: #d3e2de;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track .meta {
  grid-area: meta;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track .badge {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  color: #647774;
  border: 1px solid var(--edge);
  border-radius: 4px;
  padding: 0 4px;
  margin-left: 4px;
}
.empty-note {
  padding: 18px 14px;
  text-align: center;
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted-dim);
}

/* ── toast ────────────────────────────────────────────────────────────── */

/* Occupies the same grid cell as the topbar and is centred in it, so a status
   message can never land on top of the trace. Column 1 — a higher number here
   would conjure a second implicit column and squeeze the stage off-centre. */
.toast {
  grid-column: 1;
  grid-row: 1;
  justify-self: center;
  align-self: center;
  transform: translateY(8px);
  z-index: 60;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--edge-strong);
  background: rgba(9, 15, 20, 0.94);
  color: #cfdedb;
  font-size: 12.5px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.22s, transform 0.22s, visibility 0.22s;
  pointer-events: none;
  max-width: min(60vw, 520px);
  text-align: center;
}
.toast.show { opacity: 1; visibility: visible; transform: none; }

/* ── auto-hide chrome ─────────────────────────────────────────────────── */

body.idle .topbar,
body.idle .dock { opacity: 0; }
body.idle { cursor: none; }

/* ── responsive ───────────────────────────────────────────────────────── */

@media (max-width: 900px) {
  /* No room to reserve a rail, so panels overlay here — narrow screens only. */
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .topbar, .stage, .dock, .toast { grid-column: 1; }
  .panel {
    position: absolute;
    top: 56px; left: 0; right: 0; bottom: 0;
    width: auto; max-width: none;
    margin: 0;
    border-radius: var(--r) var(--r) 0 0;
  }
  .panel.open { display: flex; animation: panelIn 0.18s ease-out; }
#panelList { left: 16px; }
#panelSettings { right: 16px; }
@keyframes panelIn { from { opacity: 0; } to { opacity: 1; } }
  .dock { margin: 0 10px 10px; }
  .vol { display: none; }
}

@media (max-width: 760px) {
  .now { flex: 1 1 100%; order: -1; }
  .seekwrap { flex: 1 1 100%; }
  .transport { flex: 1 1 auto; justify-content: center; }
  .rate-badge { font-size: 9.5px; padding: 3px 7px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}

  let i = 0;

  if (!Number.isFinite(sec) || sec < 0) return '--:--';
  const t = Math.floor(sec);
  const m = Math.floor(t / 60);
  const s = t % 60;
  if (m >= 60) return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

  if (!hz) return null;

/* --------------------------------------------------------------- settings */

/** Analyser window sizes, in samples. Index is what the slider moves over. */
const WINDOW_CHOICES = [512, 1024, 2048, 4096, 8192, 16384, 32768];
const MAXN = 32768;          // analyser fftSize — the largest window we can show
const BUCKETS = 10;          // velocity-blanking brightness levels (bucket 0 = blanked)

/* The defaults are the midpoint of the two shipped recipes (描边 / 填充, see
   the table in README) — a trade-off, not an optimum. The optimum really does
   depend on the track; that is what the presets are for.
   What is NOT a trade-off is the blow-out bound, and that one is measured.
   Sweeping window x afterglow over the busiest passage of a line-type track,
   24 % keeps the saturated share at 0.66 % of the ink, whereas 62 % (the old
   default) pushed it to 5.3 % at 2048 and 12.8 % at 4096 — a picture that has
   dissolved into a solid mass. 2048 is the largest window that still stays
   under ~1 %, because a 4096 window already self-overlaps within one frame.
   blankRatio is the one default deliberately below the midpoint. Frozen window,

/* -------------------------------------------------------------------- dom */

const dom = {
  stage: $('stage'), bg: $('bg'), trace: $('trace'), audio: $('audio'),
  hint: $('dropHint'), hintNote: $('hintNote'),
  trackTitle: $('trackTitle'), trackSub: $('trackSub'),
  seek: $('seek'), tCur: $('tCur'), tDur: $('tDur'),
  volume: $('volume'), rate: $('rate'),
  btnPlay: $('btnPlay'), btnPrev: $('btnPrev'), btnNext: $('btnNext'),
  btnSettings: $('btnSettings'), btnList: $('btnList'), btnDemo: $('btnDemo'),
  btnShot: $('btnShot'), btnFull: $('btnFull'), btnReset: $('btnReset'),
  modelBadge: $('modelBadge'),
  panelSettings: $('panelSettings'), panelList: $('panelList'),
